---
name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and syntax check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg

      - name: Syntax check playbooks
        working-directory: ansible
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook -i inventories/production.example --syntax-check "$playbook"
          done

      - name: shellcheck
        run: shellcheck scripts/*.sh ansible/roles/ssh/files/bastion-sshd-rollback

  converge:
    name: Deploy, verify and prove idempotency (Ubuntu 24.04 VM)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANSIBLE_FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install tooling
        run: |
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      # The runner plays the "fresh VM". It only needs an SSH server and a key
      # pair for the administrator that bootstrap.yml will create.
      - name: Prepare SSH access to the runner
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server
          sudo systemctl start ssh.socket || sudo systemctl start ssh
          ssh-keygen -t ed25519 -N '' -C bastion-ci -f ~/.ssh/bastion_ci
          for attempt in $(seq 1 10); do
            ssh-keyscan -T 5 127.0.0.1 >> ~/.ssh/known_hosts 2>/dev/null && break
            sleep 2
          done
          test -s ~/.ssh/known_hosts

      - name: Create the CI vault
        run: |
          scripts/init-vault.sh ci "$RUNNER_TEMP/vault-pass"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=$RUNNER_TEMP/vault-pass" >> "$GITHUB_ENV"

      - name: Bootstrap the administrator account
        working-directory: ansible
        run: ansible-playbook -i inventories/ci playbooks/bootstrap.yml

      - name: Deploy (first run)
        working-directory: ansible
        run: ansible-playbook -i inventories/ci playbooks/server.yml

      - name: Verify
        working-directory: ansible
        run: ansible-playbook -i inventories/ci playbooks/verify.yml

      - name: Deploy again and require zero changes
        working-directory: ansible
        run: ../scripts/idempotency-check.sh -i inventories/ci playbooks/server.yml

      - name: Upload the verification report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-report
          path: reports/
          if-no-files-found: ignore

      - name: Collect diagnostics
        if: failure()
        run: |
          set +e
          sudo ufw status verbose
          sudo ss -tlnp
          sudo sshd -T | sort
          sudo docker ps -a
          sudo journalctl --no-pager -n 100 -u ssh -u docker -u fail2ban -u 'postgresql@*' -u prometheus-node-exporter
