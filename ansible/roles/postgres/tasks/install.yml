---
- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the PGDG repository signing key
  ansible.builtin.get_url:
    url: "{{ postgres_apt_key_url }}"
    dest: "{{ postgres_apt_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Add the PGDG apt repository
  ansible.builtin.deb822_repository:
    name: pgdg
    types: deb
    uris: "{{ postgres_apt_url }}"
    suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
    components: main
    signed_by: "{{ postgres_apt_key_path }}"
    mode: "0644"
    state: present
  register: postgres_repository

# The package creates the "main" cluster on install (postgresql-common).
- name: Install PostgreSQL {{ postgres_version }}
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-client-{{ postgres_version }}"
      - python3-psycopg2  # used by the community.postgresql modules
    state: present
    update_cache: "{{ postgres_repository is changed }}"

- name: Check the cluster exists
  ansible.builtin.stat:
    path: "{{ postgres_config_dir }}/postgresql.conf"
  register: postgres_cluster_config

- name: Stop if the expected cluster is missing
  ansible.builtin.assert:
    that:
      - postgres_cluster_config.stat.exists
    fail_msg: >-
      {{ postgres_config_dir }}/postgresql.conf was not found. This role manages the default cluster that
      the Debian packaging creates. List clusters with `pg_lsclusters`; creating or moving clusters is
      intentionally not automated (see docs/troubleshooting.md#postgresql).
    quiet: true
