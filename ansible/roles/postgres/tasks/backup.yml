---
- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ postgres_backup_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Install the backup script
  ansible.builtin.template:
    src: bastion-pg-backup.sh.j2
    dest: /usr/local/sbin/bastion-pg-backup
    owner: root
    group: postgres
    mode: "0750"

- name: Install the backup service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - bastion-pg-backup.service
    - bastion-pg-backup.timer
  register: postgres_backup_units

- name: Enable the backup timer
  ansible.builtin.systemd_service:
    name: bastion-pg-backup.timer
    enabled: true
    state: started
    daemon_reload: "{{ postgres_backup_units is changed }}"
