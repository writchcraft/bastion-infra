---
# --- Automatic security updates ------------------------------------------------------
# Every apt task in this repository sets lock_timeout: installing a package can
# start apt-daily/unattended-upgrades, which holds the dpkg lock for a while and
# would otherwise fail the next apt task (seen in CI on fail2ban).


- name: Configure unattended security upgrades
  when: security_unattended_upgrades | bool
  block:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        lock_timeout: 300
        name: unattended-upgrades
        state: present

    - name: Enable the periodic apt jobs
      ansible.builtin.template:
        src: 20auto-upgrades.j2
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        validate: apt-config -c %s dump

    - name: Set the unattended-upgrades policy
      ansible.builtin.template:
        src: 52bastion-unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/52bastion-unattended-upgrades
        owner: root
        group: root
        mode: "0644"
        validate: apt-config -c %s dump

    - name: Enable the apt upgrade timer
      ansible.builtin.systemd_service:
        name: apt-daily-upgrade.timer
        enabled: true
        state: started

# --- fail2ban -------------------------------------------------------------------------

- name: Configure fail2ban
  when: security_fail2ban | bool
  block:
    - name: Install fail2ban
      ansible.builtin.apt:
        lock_timeout: 300
        name:
          - fail2ban
          - python3-systemd  # journal backend
        state: present

    - name: Configure the SSH jail
      ansible.builtin.template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.d/bastion.local
        owner: root
        group: root
        mode: "0644"
      notify:
        - Validate fail2ban configuration
        - Restart fail2ban

    - name: Enable fail2ban
      ansible.builtin.systemd_service:
        name: fail2ban
        enabled: true
        state: started

# --- Kernel network parameters ---------------------------------------------------------

- name: Apply kernel network hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value | string }}"
    sysctl_file: "{{ security_sysctl_file }}"
    sysctl_set: true
    state: present
  loop: "{{ security_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"

# UFW re-applies /etc/ufw/sysctl.conf whenever it starts or reloads, which
# would put back its own values (e.g. log_martians=0) over the ones above,
# both at boot and on the next firewall change. Align any setting it also
# manages; settings it does not mention are left out of its file.
- name: Check for the UFW kernel parameter file
  ansible.builtin.stat:
    path: "{{ security_ufw_sysctl_file }}"
  register: security_ufw_sysctl

- name: Keep UFW from reverting kernel network hardening
  ansible.builtin.lineinfile:
    path: "{{ security_ufw_sysctl_file }}"
    regexp: "^(\\s*{{ item.key | replace('.', '[/.]') }}\\s*=).*$"
    line: "\\g<1>{{ item.value }}"
    backrefs: true
  loop: "{{ security_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }} = {{ item.value }}"
  when: security_ufw_sysctl.stat.exists

# --- Unneeded services ----------------------------------------------------------------

- name: Gather service facts
  ansible.builtin.service_facts:
  when: security_disabled_services | length > 0

- name: Disable unneeded services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
    masked: true
  loop: "{{ security_disabled_services }}"
  when: (item ~ '.service') in ansible_facts.services
