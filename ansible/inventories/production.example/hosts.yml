---
# Template for a real environment. Copy the whole directory:
#
#   cp -r ansible/inventories/production.example ansible/inventories/production
#
# ansible/inventories/production/ is git-ignored so that real addresses and
# vault files never reach this public repository.
#
# Addresses below are from the RFC 5737 documentation range (192.0.2.0/24).
all:
  children:
    bastion_servers:
      hosts:
        app-01:
          ansible_host: 192.0.2.21
        app-02:
          ansible_host: 192.0.2.22
