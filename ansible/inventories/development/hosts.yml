---
# Development inventory: a single disposable Ubuntu 24.04 VM.
#
# scripts/dev-vm.sh creates a Multipass VM and writes its address to
# host_vars/bastion-dev.yml (git-ignored). To target any other VM, create that
# file yourself:
#
#   ansible_host: 192.0.2.10
all:
  children:
    bastion_servers:
      hosts:
        bastion-dev:
