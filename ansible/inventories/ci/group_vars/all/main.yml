---
# Used by .github/workflows/ci.yml. The workflow generates the SSH key pair
# and the vault (scripts/init-vault.sh ci) before running any playbook.

bootstrap_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
bootstrap_connection: local
bastion_admin_user: bastion
ansible_user: "{{ bastion_admin_user }}"
ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.ssh/bastion_ci"
ansible_python_interpreter: /usr/bin/python3

enable_docker: true
enable_postgres: true
enable_monitoring: true

server_timezone: Etc/UTC
server_locale: en_US.UTF-8
# The runner image carries hundreds of packages; upgrading them all would
# dominate the job without testing anything Bastion-specific. Disabling it also
# keeps the idempotency gate deterministic: a package published between the
# first and second deployment must not register as Bastion changing state.
common_upgrade_packages: false

admin_users:
  - name: bastion
    comment: CI administrator
    ssh_keys:
      - "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/.ssh/bastion_ci.pub') }}"
    sudo: true
    sudo_nopasswd: true

docker_users:
  - bastion

postgres_version: 16
postgres_users:
  - name: app
    password: "{{ vault_postgres_app_password }}"
postgres_databases:
  - name: app
    owner: app

monitoring_grafana_admin_password: "{{ vault_grafana_admin_password }}"
