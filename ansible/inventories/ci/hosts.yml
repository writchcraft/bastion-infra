---
# CI inventory: the GitHub Actions runner configures itself.
#
# bootstrap.yml runs with a local connection as the runner account; every
# later play connects over real SSH to 127.0.0.1 as the admin user, so the
# SSH hardening, lockout guards and reconnection test are exercised exactly
# as they would be against a remote server.
all:
  children:
    bastion_servers:
      hosts:
        bastion-ci:
          ansible_host: 127.0.0.1
