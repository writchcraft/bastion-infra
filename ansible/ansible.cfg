[defaults]
# Commands are run from this directory (the Makefile does this for you).
inventory = inventories/development
roles_path = roles
collections_path = ~/.ansible/collections:/usr/share/ansible/collections

# Never trust an unknown host key silently. Accept the key once with
# `ssh-keyscan` or a manual login; see docs/troubleshooting.md.
host_key_checking = True

interpreter_python = auto_silent
retry_files_enabled = False
forks = 10

# Readable output for demos and idempotency checks: skipped tasks are noise,
# and YAML-formatted results are easier to read than JSON blobs.
callback_result_format = yaml
display_skipped_hosts = False

[ssh_connection]
# Pipelining avoids temporary files on the target, which is faster and lets
# `become_user: postgres` work without world-readable temp files.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30

[privilege_escalation]
become_method = sudo
